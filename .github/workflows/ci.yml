name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify code formatting
        run: test -z "$(go fmt ./...)"

      - name: Run unit & race tests
        run: go test -v -race ./...

      - name: Build binary
        run: make build

      - name: Smoke test CLI
        run: |
          ./bin/compat version
          ./bin/compat version --json
          ./bin/compat doctor
          ./bin/compat engine list
