id: missing-shared-library
severity: fatal
cause: "Dynamic linker (ld.so) failed to load a required ELF shared library dependency"
detect:
  log_regexes:
    - "error while loading shared libraries: (lib[a-zA-Z0-9_+\\-.]+\\.so(\\.[0-9]+)*): cannot open shared object file"
    - "cannot open shared object file: No such file or directory"
fixes:
  - id: fix-install-missing-lib
    description: "Install missing library using host package manager"
    tier: 1
    action: package_install
    command:
      - "pkexec"
      - "dnf"
      - "install"
      - "-y"
verify:
  min_uptime_seconds: 10
  require_window: false
manual_steps:
  - "Query the package providing the missing library:"
  - "  On Fedora/RHEL: dnf provides '*/lib<name>.so*'"
  - "  On Debian/Ubuntu: apt-file search lib<name>.so"
  - "  On Arch Linux: pacman -F lib<name>.so"
  - "  On openSUSE: zypper wp lib<name>.so"
